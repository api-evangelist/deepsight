aid: deepsight
name: DeepSight Technology
description: DeepSight Technology is a medical-imaging company reinventing diagnostic ultrasound.
  It is building a semiconductor-based ultrasound sensor and imaging platform (including its NeedleVue
  technology) to deliver a step-change in ultrasound performance, making this safe, non-invasive,
  radiation-free, low-cost imaging modality far more usable across clinical applications. The company
  is a hardware and medical-device business backed by Wing Venture Capital and Deerfield; it is added
  to the API Evangelist network as a Wing portfolio lead. It does not currently publish a public
  developer program, API, SDK, or documentation surface.
